<text x="1025.0" y="560.0" font-size="12" text-anchor="middle" fill="#6e7781" font-weight="normal">enheter i hörnen, vinklade 45°: kupolerna överlappar en bit ut,</text>
<text x="1025.0" y="576.0" font-size="12" text-anchor="middle" fill="#6e7781" font-weight="normal">men nära robotens sidor finns en smal död zon</text>
<text x="1025.0" y="592.0" font-size="12" text-anchor="middle" fill="#6e7781" font-weight="normal">enheterna turas om att sända så att de inte stör varandra</text>
